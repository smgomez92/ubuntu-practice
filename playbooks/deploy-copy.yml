---
- name: Desplegar archivo X en múltiples servidores Docker
  hosts: cluster_servidores
  gather_facts: no

  tasks:
    - name: Asegurar que el directorio de destino exista en el servidor remoto
      file:
        path: /opt/app
        state: directory
        mode: '0755'

   - name: Crear un archivo de bienvenida personalizado
      copy:
        dest: /opt/app/info.txt
        content: |
          ¡Hola, Sgomez!
          Este archivo fue creado automáticamente usando Ansible.
          Fecha de despliegue: {{ ansible_date_time.date }}
        mode: '0644'

